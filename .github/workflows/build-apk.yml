name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          code=$?
          echo "::group::Full gradle output"
          cat build.log
          echo "::endgroup::"
          if [ $code -ne 0 ]; then
            grep -n "^e: " build.log > errors.txt
            if [ -s errors.txt ]; then
              SRC=errors.txt
            else
              tail -c 6000 build.log > errors.txt
              SRC=errors.txt
            fi
            ESCAPED=$(cat "$SRC" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::${ESCAPED}"
          fi
          exit $code

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fokus-stb-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
